services:
  searxng-redis:
    image: valkey/valkey:8-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "30 1"
      - --loglevel
      - warning
    volumes:
      - searxng_redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [llm-net]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    depends_on:
      searxng-redis:
        condition: service_healthy
    ports:
      - "${SEARXNG_HOST_PORT:-8081}:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8081/}
      - INSTANCE_NAME=${SEARXNG_INSTANCE_NAME:-OpenWebUI SearXNG}
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - 'http://127.0.0.1:8080/search?q=test&format=json' | grep -q '\"results\"'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [llm-net]

volumes:
  searxng_redis_data:
    name: searxng-redis-volume

networks:
  llm-net:
    external: true
    name: llm-stack-net
